name: Nightly ingest

on:
  schedule:
    # The fallback. Asks for 07:10 UTC = 03:10 ET, but GitHub treats a schedule
    # as a request, not a start time: every run from 2026-09-25 to 10-01 started
    # 5 to 8 hours late, and one can be dropped. The on-time start is a
    # workflow_dispatch sent at 07:10 UTC by Supabase (db/ops/nightly_dispatch.sql);
    # when it has run, this one stops at --once-per-day. Nothing here may depend
    # on when, or whether, a given run happens. When this one finds the night
    # not done, it runs it and then fails (--fallback), so a broken on-time
    # start gets an email instead of going unnoticed.
    - cron: "10 7 * * *"
    # Weekly database backup, Sundays after the night's run. Only the backup
    # job runs on this one.
    - cron: "23 9 * * 0"
    # Monthly keepalive. Only the keepalive job runs on this one.
    - cron: "41 10 11 * *"
  workflow_dispatch:
    inputs:
      task:
        description: >-
          ingest: the nightly job. probe-stores: list a banner's stores and
          canary-check their codes (API only, writes nothing).
          catalogue-sample: print what cross-store matching has to work with
          (read-only SQL). storage-report: rows written per night, why, and when
          the database reaches 500 MB (read-only SQL). match-report: print the pairs ingest/match.py would
          make across the whole catalogue (read-only). migrate: apply the
          migrations named below, in order (WRITES to the database). backup:
          dump the public schema now, as the weekly backup does (read-only).
        type: choice
        options: [ingest, probe-stores, catalogue-sample, storage-report, match-report, migrate, backup]
        default: ingest
      dry_run:
        description: "ingest only: fetch and normalize without writing to Postgres"
        type: boolean
        default: false
      force:
        description: "ingest only: run even if every store already has a run today"
        type: boolean
        default: false
      probe:
        description: "probe-stores only: arguments for python -m ingest.stores"
        type: string
        default: "discover zehrs fortinos --near 43.6534,-79.3839"
      migrations:
        description: "migrate only: migration numbers to apply, in order, e.g. 0008 0009 0010"
        type: string
        default: ""

# The jobs read the repository; the database and the PCX API are reached with
# secrets, not the job token. keepalive sets its own permissions, which replace
# these for that job only.
permissions:
  contents: read

jobs:
  ingest:
    if: >-
      github.event.schedule == '10 7 * * *'
      || (github.event_name == 'workflow_dispatch' && inputs.task == 'ingest')
    # Never run two ingests at once. A queued run that overlaps the previous one
    # would double the request rate against an API we are deliberately being
    # gentle with. Scoped to this job so a keepalive run can never hold up or
    # replace a queued ingest, whenever the two happen to land.
    concurrency:
      group: ingest
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # About 3 minutes a store: seven took 21 min 44 s on 2026-10-01 (168
    # requests each at 1 req/sec, plus writes), so the twelve since 0014 take
    # about 37. A full run must fit in half of this (ingest/tests/test_targets.py
    # reads it from here), so 90 minutes holds thirteen stores; past that, split
    # the job rather than raise it again.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Run ingestion
        env:
          PCX_API_KEY: ${{ secrets.PCX_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INGEST_RATE_LIMIT_SECONDS: "1.0"
        # --once-per-day: the night is started on time from Supabase
        # (db/ops/nightly_dispatch.sql), and this schedule fires hours later as
        # the fallback. Whichever comes second stops before any API request.
        # --fallback on the schedule: if it is not second, it records the night
        # and then exits 3, failing the job so the broken start is noticed.
        # Should GitHub ever fire on time and win the race, that is a false
        # alarm; the night is recorded either way.
        run: |
          python -m ingest.run ${{ !inputs.force && '--once-per-day' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }} ${{ github.event_name == 'schedule' && '--fallback' || '' }}

  # A new banner's store code has to be proved before a migration adds it: a
  # wrong one returns 200 with zero results, like a store with nothing in
  # stock. A dozen requests at the usual floor. Not in the ingest concurrency
  # group, where a pending run replaces the one already queued: this must never
  # be what displaces a nightly ingest.
  probe-stores:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'probe-stores'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Probe store codes
        env:
          PCX_API_KEY: ${{ secrets.PCX_API_KEY }}
          INGEST_RATE_LIMIT_SECONDS: "1.0"
          # Through the environment, never interpolated into the script.
          PROBE_ARGS: ${{ inputs.probe }}
        run: |
          set -f
          python -m ingest.stores $PROBE_ARGS

  catalogue-sample:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'catalogue-sample'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The file's first statement makes the transaction read-only.
      - name: Sample the catalogue
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: psql "$DATABASE_URL" --single-transaction -v ON_ERROR_STOP=1 -f db/queries/catalogue_sample.sql

  storage-report:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'storage-report'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The file's first statement makes the transaction read-only.
      - name: Report storage growth
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: psql "$DATABASE_URL" --single-transaction -v ON_ERROR_STOP=1 -f db/queries/storage_growth.sql

  match-report:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'match-report'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      # The connection is opened read-only.
      - name: Report match candidates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m ingest.match report --limit 150

  # Applies db/migrations files by number, the same psql command the migrations
  # README gives, with the connection string the nightly run already uses. Each
  # file is its own transaction, so one that fails changes nothing; the run
  # stops there. Safe beside a nightly ingest: a migration that needs a lock
  # the ingest holds waits the few seconds one store's write takes.
  migrate:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'migrate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Through the environment, never interpolated into the script.
          MIGRATIONS: ${{ inputs.migrations }}
        run: |
          set -euo pipefail
          if [ -z "${MIGRATIONS// }" ]; then
            echo "Name the migrations to apply, e.g. 0008 0009 0010."
            exit 1
          fi
          for number in $MIGRATIONS; do
            if ! [[ "$number" =~ ^[0-9]{4}$ ]]; then
              echo "Not a migration number: $number"
              exit 1
            fi
            files=(db/migrations/"$number"_*.sql)
            if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
              echo "No single migration numbered $number"
              exit 1
            fi
            echo "::group::${files[0]}"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "${files[0]}"
            echo "::endgroup::"
          done

  # Supabase's free plan keeps no backups a project can download, and price
  # history cannot be fetched again. Weekly, the public schema (every table the
  # site reads, all readable with the anon key anyway) is dumped and kept as an
  # artifact for 90 days. Not vault or cron: the dispatch token stays out.
  # README.md, "Backups", says how to restore one.
  backup:
    if: >-
      github.event.schedule == '23 9 * * 0'
      || (github.event_name == 'workflow_dispatch' && inputs.task == 'backup')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # pg_dump must be at least the server's major version (17); the runner's
      # own client is 16, so it runs from the official image instead.
      # GitHub's runners have no IPv6, so it goes through the pooler, and in
      # session mode (5432): pg_dump holds one snapshot for its whole session,
      # which transaction mode (6543, the nightly run's port) cannot promise.
      - name: Dump the public schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          day=$(date -u +%F)
          echo "DAY=$day" >> "$GITHUB_ENV"
          # Masked, and handed over by name rather than on the command line:
          # with its port changed it no longer matches the secret GitHub masks.
          export SESSION_URL="${DATABASE_URL/:6543\//:5432/}"
          echo "::add-mask::$SESSION_URL"
          docker run --rm --network host -e SESSION_URL postgres:17 \
            sh -c 'pg_dump "$SESSION_URL" --format=custom --schema=public --extension=pg_trgm' \
            > "grocery-tracker-$day.dump"

      # A dump that cannot be read back is not a backup. Stop here unless the
      # price history and the products made it in.
      - name: Check the dump
        run: |
          set -euo pipefail
          file="grocery-tracker-$DAY.dump"
          docker run --rm -v "$PWD:/b:ro" postgres:17 pg_restore --list "/b/$file" > contents.txt
          for table in price_spans products ingest_runs stores; do
            grep -q "TABLE DATA public $table " contents.txt || { echo "::error::$table is missing from the dump"; exit 1; }
          done
          echo "$file: $(du -h "$file" | cut -f1), $(grep -c 'TABLE DATA' contents.txt) tables" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: database-${{ env.DAY }}
          path: grocery-tracker-${{ env.DAY }}.dump
          retention-days: 90
          # Already compressed by pg_dump.
          compression-level: 0
          if-no-files-found: error

  # GitHub disables scheduled workflows in a public repo after 60 days without
  # repository activity, and the nightly runs themselves don't count. Enabling
  # the workflow through the API resets that clock without a commit. Being late
  # doesn't matter here; a dropped month would put the next run past day 60, and
  # only a push in between would cover that.
  keepalive:
    if: github.event.schedule == '41 10 11 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/ingest.yml/enable"
